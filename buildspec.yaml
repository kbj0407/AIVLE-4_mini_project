version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - echo "===== INSTALL PHASE ====="
      - java -version

  build:
    commands:
      - echo "===== DEBUG: WHERE AM I ====="
      - pwd
      - echo "===== DEBUG: LIST ROOT ====="
      - ls
      - echo "===== DEBUG: LIST AIVLE-4_mini_project (if exists) ====="
      - ls AIVLE-4_mini_project || echo "AIVLE-4_mini_project not found"
      - echo "===== MOVE TO SPRING PROJECT ====="
      - cd AIVLE-4_mini_project/miniproject4-spring/miniproject04
      - echo "===== DEBUG: CURRENT DIR ====="
      - pwd
      - echo "===== DEBUG: LIST CURRENT DIR ====="
      - ls
      - echo "===== GRANT EXECUTE PERMISSION ====="
      - chmod +x gradlew
      - echo "===== BUILD START ====="
      - ./gradlew clean build -x test

artifacts:
  files:
    - AIVLE-4_mini_project/miniproject4-spring/miniproject04/build/libs/*.jar
