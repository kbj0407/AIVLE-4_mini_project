spring:
  application:
    name: miniproject04

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:/home/ubuntu/h2db/demodb
    username: sa
    password: 1234

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true   # ✅ 이 줄 추가

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true


